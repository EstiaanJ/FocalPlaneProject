[workspace]
members = [
    "crates/better-plots",
    "crates/exposure-cruve-tool",
    "crates/focal-core",
    "crates/focal-editor",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
focal-core = { path = "crates/focal-core" }
focal-plot = { package = "better-plots", path = "crates/better-plots" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
moxcms = "0.8.1"
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
