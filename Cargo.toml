[workspace]
members = [
    "crates/focal-curve",
    "crates/focal-core",
    "crates/focal-editor",
    "crates/focal-io",
    "crates/focal-plot",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
focal-core = { path = "crates/focal-core" }
focal-io = { path = "crates/focal-io" }
focal-plot = { path = "crates/focal-plot" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
moxcms = "0.8.1"
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rawler = "0.7.2"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
